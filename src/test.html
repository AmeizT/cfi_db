<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Improved CFI Database Workspace</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="h-14 border-b border-slate-200 bg-white px-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <!-- Workspace Dropdown -->
            <button
                class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-sm font-medium transition">
                <span
                    class="w-5 h-5 bg-blue-600 rounded text-white flex items-center justify-center font-bold text-xs">O</span>
                <span>Orwetoveni</span>
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>

        <!-- Central Search Bar -->
        <div class="w-full max-w-xl mx-4">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </span>
                <input type="text" placeholder="Search workspace..."
                    class="w-full bg-slate-100 hover:bg-slate-200/70 focus:bg-white text-sm pl-10 pr-4 py-1.5 rounded-full border border-transparent focus:border-blue-500 focus:outline-none transition">
            </div>
        </div>

        <!-- Quick Actions / Profile -->
        <div class="flex items-center gap-3">
            <button class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
            <button class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 relative transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                    </path>
                </svg>
            </button>
            <div
                class="w-8 h-8 rounded-full bg-pink-100 border border-pink-200 text-pink-700 flex items-center justify-center font-semibold text-sm">
                E</div>
        </div>
    </header>

    <!-- Shell Container -->
    <div class="flex flex-1">

        <!-- IMPROVED RAMP-INSPIRED SIDEBAR -->
        <aside class="w-64 border-r border-slate-200 bg-white flex flex-col justify-between select-none">
            <div class="p-3 space-y-6">

                <!-- Workspace Main Link -->
                <div>
                    <a href="#"
                        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-semibold text-slate-900 hover:bg-slate-50 transition">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z">
                            </path>
                        </svg>
                        Workspace Overview
                    </a>
                </div>

                <!-- Section: Operations -->
                <div class="space-y-0.5">
                    <div class="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Operations
                    </div>

                    <!-- Parent Block: Finance -->
                    <div class="space-y-0.5">
                        <button
                            class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
                            <div class="flex items-center gap-2.5">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7"></path>
                                </svg>
                                <span>Finance</span>
                            </div>
                        </button>

                        <!-- Nesting Child Sub-Links (Indented & clean hierarchy) -->
                        <div class="pl-4 space-y-0.5 border-l border-slate-100 ml-5">
                            <a href="#"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition">Overview</a>

                            <!-- Clean Active Link State (Ramp Style) -->
                            <a href="#"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold bg-blue-50/70 text-blue-600 transition">Tithes</a>

                            <a href="#"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition">Revenue</a>
                            <a href="#"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition">Expenses</a>
                            <a href="#"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition">Statements</a>
                            <a href="#"
                                class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition">Remittance</a>
                        </div>
                    </div>

                    <!-- Parent Block: Engagement -->
                    <div class="pt-1">
                        <button
                            class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
                            <div class="flex items-center gap-2.5">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 5l7 7-7 7"></path>
                                </svg>
                                <span>Engagement</span>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Section: Organization -->
                <div class="space-y-0.5">
                    <div class="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Organization
                    </div>
                    <a href="#"
                        class="flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
                        <span class="w-4 text-center text-slate-400 text-xs">👤</span> People
                    </a>
                    <a href="#"
                        class="flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
                        <span class="w-4 text-center text-slate-400 text-xs">🏢</span> Spaces
                    </a>
                    <a href="#"
                        class="flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
                        <span class="w-4 text-center text-slate-400 text-xs">📦</span> Assets
                    </a>
                </div>

            </div>

            <!-- Bottom Profile/Footer Node -->
            <div class="p-3 border-t border-slate-100 bg-slate-50/50">
                <a href="#"
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition">
                    <span>Resources</span>
                </a>
            </div>
        </aside>

        <!-- MAIN VIEW AREA WITH INLINE TABS -->
        <main class="flex-1 bg-white p-8 flex flex-col">

            <!-- Title & Year Filter Row -->
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Tithes</h1>

                <!-- Clean Year Dropdown Filter -->
                <button
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm transition">
                    <span>2026</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>

            <!-- INLINE NAVIGATION TABS -->
            <div class="border-b border-slate-200 mb-6">
                <nav class="flex gap-6 -mb-px" aria-label="Tabs">
                    <a href="#" class="border-b-2 border-blue-600 pb-3 px-1 text-sm font-semibold text-blue-600"
                        aria-current="page">Transactions</a>
                    <a href="#"
                        class="border-b-2 border-transparent pb-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300">Contributors</a>
                    <a href="#"
                        class="border-b-2 border-transparent pb-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300">Cumulative</a>
                    <a href="#"
                        class="border-b-2 border-transparent pb-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300">Receipts</a>
                    <a href="#"
                        class="border-b-2 border-transparent pb-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300">More</a>
                </nav>
            </div>

            <!-- Horizontal Month Sub-filter Links -->
            <div class="flex flex-wrap gap-1 mb-12">
                <a href="#"
                    class="px-3 py-1 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-md transition">Jan</a>
                <a href="#"
                    class="px-3 py-1 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-md transition">Feb</a>
            </div>
        </main>
    </div>
</body>
</html>
